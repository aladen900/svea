events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression Optimization for SEO Crawlers
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ----------------------------------------------------
    # 1. HTTP -> HTTPS Redirect & www -> non-www (Port 80)
    # ----------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name svea-iptv.com www.svea-iptv.com;

        # Let's Encrypt Certbot Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 301 Permanent Redirect to Canonical HTTPS Domain
        location / {
            return 301 https://svea-iptv.com$request_uri;
        }
    }

    # ----------------------------------------------------
    # 2. HTTPS www -> HTTPS non-www Redirect (Port 443)
    # ----------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.svea-iptv.com;

        ssl_certificate /etc/letsencrypt/live/svea-iptv.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/svea-iptv.com/privkey.pem;

        return 301 https://svea-iptv.com$request_uri;
    }

    # ----------------------------------------------------
    # 3. Main HTTPS Canonical Server Block (svea-iptv.com)
    # ----------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name svea-iptv.com;

        ssl_certificate /etc/letsencrypt/live/svea-iptv.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/svea-iptv.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Static asset caching rules for Nginx
        location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp|avif)$ {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Main App Proxy to Node.js Express Container (app:3000)
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}

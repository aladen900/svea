<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- TV Monitor Frame -->
  <rect x="100" y="120" width="312" height="220" rx="28" fill="#090d16" stroke="url(#emeraldGrad)" stroke-width="18" filter="url(#glow)"/>
  
  <!-- Play Button Triangle -->
  <path d="M225 180 L315 230 L225 280 Z" fill="url(#emeraldGrad)"/>
  
  <!-- TV Stand Base -->
  <path d="M190 340 L160 400 M322 340 L352 400" stroke="url(#emeraldGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M140 400 L372 400" stroke="url(#emeraldGrad)" stroke-width="18" stroke-linecap="round"/>
</svg>
